<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tech Innovation Summit 2026</title>
</head>

<body>

    <a href="#main-content">Skip to main content</a>

    <header>
        <h1>Tech Innovation Summit 2026</h1>
        <p>The Future of Technology Starts Here.</p>
    </header>

    <main id="main-content">

        <section id="event-info">
            <h2>About the Event</h2>
            <p>
                Join developers and technology
                enthusiasts to explore new innovations.
            </p>
            <p>Event Date: December 31, 2026</p>
        </section>

        <section id="countdown-section">
            <h2>Event Countdown</h2>

            <p id="countdown" role="timer">
                Loading countdown...
            </p>
        </section>

        <section id="registration-section">
            <h2>Event Registration</h2>

            <form id="registration-form">

                <label for="full-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    autocomplete="name"
                    minlength="2"
                    required>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required>

                <button
                    type="submit"
                    id="submit-btn">
                    Register Now
                </button>

            </form>

            <p id="form-message"
               role="status"
               aria-live="polite"></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Tech Innovation Summit</p>
    </footer>

</body>
</html>
